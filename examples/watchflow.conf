# WatchFlow MVP configuration
# Format:
# WATCH|directory
# RULE|name|EVENT|MATCHER|VALUE|ACTION|VALUE

WATCH|./sandbox

# Regex matcher: filename must match the regex.
RULE|Copy PDFs|CREATED|REGEX|.*\.pdf|COPY|./output/pdfs

# File-size matcher: value is bytes.
RULE|Compress large files|MODIFIED|SIZE_GT|1048576|COMPRESS|.gz

# Execute shell command. {file} is replaced by the event path.
RULE|Compile C++|MODIFIED|REGEX|.*\.cpp|EXECUTE|g++ "{file}" -std=c++20 -o "{file}.out"

# Linux desktop notification. Requires notify-send.
RULE|Notify PDFs|CREATED|REGEX|.*\.pdf|NOTIFY|New PDF: {file}
